    <header>
        <h1>Calculadora de IMC</h1>

    <main>
        <section class="tool-container">

            <div class="tool-container-title">
                <h2><i class="fas fa-weight"></i>
                     Cálculo do IMC
                </h2>
            </div>

            <form action="">
                <div class="form-group">
                <label for="">Peso (kg)</label>
                <input type="number" placeholder="Ex: 70" id="weight">
                </div>

                <div class="form-group">
                <label for="">Altura (m)</label>
                <input type="number" placeholder="Ex: 1.75" id="height">
                </div>

                <button>Calcular</button>
            </form>

            <div>
                <p>Seu IMC é:</p>
                <p>00.0</p>
                <p>Classificação:</p>
            </div>
