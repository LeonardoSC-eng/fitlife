    <nav>

    <header>
        <h1>Calculadora da TMB</h1>
    </header>


    <main>
        <section>

            <form action="">
                
                <label for="gender">Gêneros</label>

                <select name="" id="gender">
                    <option value="female">Feminino</option>
                    <option value="male">Masculino</option>
                </select>

                <div>
                <label for="height">Altura (cm)</label>
                <input type="number" id="height" placeholder="Ex: 175" max="4">
                </div>
                
                <div>
                <label for="weight">Peso (kg)</label>
                <input type="number" id="weight" placeholder="Ex: 98">
                </div>

                <div>
                <label for="age">Idade (Anos)</label>
                <input type="number" id="age" placeholder="Ex: 18">
                </div>

                <button>Calcular calorias</button>

            </form>

            <a href="../index.html">Voltar</a>

            <div>
                <p>Gasto calórico basal</p>
                <p>0000</p>
                <p>Kcal/dia</p>
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 FitLife</p>
    </footer>
